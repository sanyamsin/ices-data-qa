name: pipeline

on:
  schedule:
    # Weekly, Monday 06:00 UTC — keeps the QA report fresh
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

           - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-quarto@v2

      - uses: r-lib/actions/setup-renv@v2
      - name: Run the targets pipeline
        shell: Rscript {0}
        run: targets::tar_make()

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: report/qa-report.html
          retention-days: 30

      - name: Fail if the data quality is degraded
        shell: Rscript {0}
        run: |
          status <- targets::tar_read(qa_status)
          if (identical(status, "fail")) {
            stop("QA status is FAIL — see report artifact for details.")
          }